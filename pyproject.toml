[project]
name = "crypto-market-rag"
version = "0.1.0"
description = "RAG layer on top of crypto-market-pipeline — hybrid retrieval (structured SQL + vector) with a generic/domain-agnostic architecture."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  # --- core / config ---------------------------------------------------
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",     # reads config from .env, used in utils/config.py

  # --- database ----------------------------------------------------------
  "psycopg[binary]>=3.1,<4.0",       # Postgres driver (psycopg3)
  "pgvector>=0.2,<0.3",              # vector() type helper for psycopg/sqlalchemy

  # --- embedding & LLM (local via Ollama) --------------------------------
  "ollama>=0.2,<0.3",                # official Ollama client, used in embedding/embedder.py & generation/llm_client.py

  # --- text processing (chunking) ----------------------------------------
  "tiktoken>=0.7,<0.8",              # token counting for chunking strategy

  # --- CLI -----------------------------------------------------------------
  "typer>=0.12,<0.13",               # used in rag_src/cli/main.py
  "rich>=13.7,<14.0",                # nicer CLI output

  # --- logging -----------------------------------------------------------
  "structlog>=24.1,<25.0",           # used in rag_src/utils/logger.py, structured logging

  # --- ingestion -----------------------------------------------------------
  "feedparser>=6.0,<7.0",            # RSS feed parsing, used in ingestion/news_scraper.py
  "requests>=2.32,<3.0",             # HTTP client, used in ingestion/coin_description.py
  "beautifulsoup4>=4.12,<5.0",       # strip HTML from RSS summaries, used in ingestion/news_scraper.py
]

# --- orchestration (Phase 1, step 7) --------------------------------------
# apache-airflow is INTENTIONALLY not installed via Poetry here.
# Reason: Airflow ships its own dependency constraint file per Python version,
# and is normally installed in its own Airflow image/container (not in the
# local dev venv alongside the application code). dags/*.py just imports from
# rag_src/ at runtime inside the Airflow container. Confirmed by the previous
# project (crypto-market-pipeline): Airflow runs from Docker directly, never
# added to that project's pyproject.toml either — same pattern here.

[tool.poetry]
packages = [{ include = "rag_src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
ruff = "^0.4"                    # lint + format, replaces black+isort+flake8
mypy = "^1.10"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=rag_src --cov-report=term-missing"
